version: "2"
run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - forbidigo
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  settings:
    forbidigo:
      forbid:
        - pattern: '^.*\.MustLocalize.*(# MustLocalize may cause panic such as #252, use one of localize functions in utils package instead)?'
    goconst:
      min-len: 2
      min-occurrences: 2
      # "call" is the golangci-lint default. "compositelit" was added by
      # goconst v1.11: it flags every repeated string inside a composite
      # literal, which for this code base is almost entirely i18n message
      # definitions and struct/map literals of test data.
      exclude-types:
        - Call
        - CompositeLit
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: US

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - dupl
          - goconst
        path: _test\.go
      # pluginctl is a local developer tool; its "tainted" inputs are the
      # developer's own environment variables and file paths.
      - linters:
          - gosec
        path: build/pluginctl/
        text: via taint analysis

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/matterpoll/matterpoll
